name: Update YouTube Videos

on:
  # 3시간마다 자동 확인
  schedule:
    - cron: "30 */3 * * *"

  # GitHub에서 직접 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update YouTube videos
        run: python update_youtube.py

      - name: Commit updated YouTube data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-videos.json
          git diff --cached --quiet || git commit -m "유튜브 작업영상 자동 업데이트"
          git push