name: Update Naver Blog Posts

on:
  # 3시간마다 자동 확인
  schedule:
    - cron: "0 */3 * * *"

  # GitHub에서 수동 실행도 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update blog posts
        run: python update_blog.py

      - name: Commit updated blog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-posts.json blog-images/
          git diff --cached --quiet || git commit -m "블로그 작업사례 자동 업데이트"
          git push